name: Publish catalog

on:
  workflow_dispatch:
    inputs:
      data_file:
        description: Reviewed declarative input path
        required: true
        default: fixtures/minimal-v1.json
        type: string
      dry_run:
        description: Build and verify only; do not create a release
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: catalog-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: catalog-publication
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Validate reviewed input
        env:
          DATA_FILE: ${{ inputs.data_file }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          DATA_FILE="${DATA_FILE#"${DATA_FILE%%[![:space:]]*}"}"
          DATA_FILE="${DATA_FILE%"${DATA_FILE##*[![:space:]]}"}"
          test -n "$DATA_FILE"
          case "$DRY_RUN:$DATA_FILE" in
            true:fixtures/*.json|true:data/*.json|false:data/*.json) ;;
            *) echo "data_file must be a JSON file below data/" >&2; exit 2 ;;
          esac
          test -f "$DATA_FILE"
          go run ./cmd/catalogctl validate "$DATA_FILE"
      - name: Build immutable assets
        env:
          DATA_FILE: ${{ inputs.data_file }}
        run: |
          go run ./cmd/catalogctl build "$DATA_FILE" catalog-v1.json
          go run ./cmd/catalogctl latest catalog-v1.json catalog-v1.json latest.json
          sha256sum catalog-v1.json latest.json
      - name: Sign assets
        env:
          CATALOG_PRIVATE_KEY: ${{ secrets.CATALOG_ED25519_PRIVATE_KEY_BASE64 }}
          CATALOG_KEY_ID: ${{ vars.CATALOG_KEY_ID }}
        run: |
          umask 077
          printf '%s' "$CATALOG_PRIVATE_KEY" > private-key.base64
          go run ./cmd/catalogctl sign catalog-v1.json "$CATALOG_KEY_ID" private-key.base64 catalog-v1.json.sig
          go run ./cmd/catalogctl sign latest.json "$CATALOG_KEY_ID" private-key.base64 latest.json.sig
          rm -f private-key.base64
          sha256sum catalog-v1.json catalog-v1.json.sig latest.json latest.json.sig
      - name: Create and verify immutable GitHub draft
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(jq -r '.release_tag' latest.json)"
          case "$tag" in catalog-v1-[0-9][0-9][0-9][0-9][0-9][0-9]) ;; *) echo "invalid generated release tag" >&2; exit 1 ;; esac
          mkdir github-immutable
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release download "$tag" --dir github-immutable --pattern 'catalog-v1.json*'
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" \
              --notes "Catalog Snapshot from ${GITHUB_SHA}" --draft \
              catalog-v1.json catalog-v1.json.sig
            gh release download "$tag" --dir github-immutable --pattern 'catalog-v1.json*'
          fi
          cmp catalog-v1.json github-immutable/catalog-v1.json
          cmp catalog-v1.json.sig github-immutable/catalog-v1.json.sig
      - name: Create and verify immutable CNB draft
        if: ${{ !inputs.dry_run }}
        env:
          CNB_TOKEN: ${{ secrets.CNB_CATALOG_TOKEN }}
          CNB_REPOSITORY: ${{ vars.CNB_CATALOG_REPOSITORY }}
        run: |
          tag="$(jq -r '.release_tag' latest.json)"
          api="https://api.cnb.cool/${CNB_REPOSITORY}/-/releases"
          releases="$(curl -fsS "$api?page=1&page_size=100" -H "Authorization: Bearer $CNB_TOKEN" -H 'Accept: application/vnd.cnb.api+json' || true)"
          existing="$(jq -e --arg tag "$tag" '.[]? | select(.tag_name == $tag)' <<<"$releases" || true)"
          release_id="$(jq -r '.id // empty' <<<"$existing")"
          if test -z "$release_id"; then
            release="$(curl -sS --fail-with-body -X POST "$api" -H "Authorization: Bearer $CNB_TOKEN" -H 'Accept: application/vnd.cnb.api+json' -H 'Content-Type: application/json' --data "$(jq -nc --arg tag "$tag" --arg commit "$GITHUB_SHA" '{tag_name:$tag,target_commitish:"main",name:$tag,body:("Catalog snapshot from GitHub commit " + $commit),draft:true,make_latest:"false"}')")"
            release_id="$(jq -er '.id' <<<"$release")"
          elif test "$(jq -er '.draft' <<<"$existing")" != true; then
            echo "CNB immutable release is already published: $tag" >&2
            exit 1
          fi
          upload() {
            file="$1"
            form="$(jq -nc --arg name "$(basename "$file")" --argjson size "$(wc -c < "$file")" '{asset_name:$name,size:$size,ttl:0,overwrite:true}')"
            ticket="$(curl -fsS -X POST "$api/$release_id/asset-upload-url" -H "Authorization: Bearer $CNB_TOKEN" -H 'Accept: application/vnd.cnb.api+json' -H 'Content-Type: application/json' --data "$form")"
            curl -fsS -X PUT --upload-file "$file" "$(jq -er '.upload_url' <<<"$ticket")"
            curl -fsS -X POST -H "Authorization: Bearer $CNB_TOKEN" -H 'Accept: application/vnd.cnb.api+json' "$(jq -er '.verify_url' <<<"$ticket")?ttl=0"
          }
          upload catalog-v1.json
          upload catalog-v1.json.sig
          verify_cnb_asset() {
            file="$1"
            release_json="$2"
            name="$(basename "$file")"
            if ! asset="$(jq -e --arg name "$name" '.assets[]? | select(.name == $name)' <<<"$release_json")"; then
              echo "CNB asset not found after upload: $name" >&2
              return 1
            fi
            hash_algo="$(jq -er '.hash_algo // empty' <<<"$asset" | tr '[:upper:]' '[:lower:]')"
            expected_hash="$(jq -er '.hash_value' <<<"$asset" | tr '[:upper:]' '[:lower:]')"
            expected_size="$(jq -er '.size' <<<"$asset")"
            actual_hash="$(sha256sum "$file" | awk '{print $1}')"
            actual_size="$(wc -c < "$file" | tr -d '[:space:]')"
            case "$hash_algo" in
              sha256|sha-256|sha_256) ;;
              *)
              echo "unsupported CNB hash algorithm for $name: $hash_algo" >&2
              return 1
              ;;
            esac
            test "$actual_size" = "$expected_size" || {
              echo "CNB size mismatch for $name: expected $expected_size, got $actual_size" >&2
              return 1
            }
            test "$actual_hash" = "$expected_hash" || {
              echo "CNB SHA-256 mismatch for $name" >&2
              return 1
            }
          }
          release_after_upload="$(curl -fsS "$api/$release_id" -H "Authorization: Bearer $CNB_TOKEN" -H 'Accept: application/vnd.cnb.api+json')"
          verify_cnb_asset catalog-v1.json "$release_after_upload"
          verify_cnb_asset catalog-v1.json.sig "$release_after_upload"
          printf '%s' "$release_id" > cnb-immutable-release-id
      - name: Update and verify both latest pointers
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          CNB_TOKEN: ${{ secrets.CNB_CATALOG_TOKEN }}
          CNB_REPOSITORY: ${{ vars.CNB_CATALOG_REPOSITORY }}
        run: |
          gh release upload catalog-latest latest.json latest.json.sig --clobber
          mkdir github-latest
          gh release download catalog-latest --dir github-latest --pattern 'latest.json*'
          cmp latest.json github-latest/latest.json
          cmp latest.json.sig github-latest/latest.json.sig
          api="https://api.cnb.cool/${CNB_REPOSITORY}/-/releases"
          releases="$(curl -fsS "$api?page=1&page_size=100" -H "Authorization: Bearer $CNB_TOKEN" -H 'Accept: application/vnd.cnb.api+json' || true)"
          latest="$(jq -e '.[]? | select(.tag_name == "catalog-latest")' <<<"$releases" || true)"
          release_id="$(jq -r '.id // empty' <<<"$latest")"
          if test -z "$release_id"; then release_id="$(curl -sS --fail-with-body -X POST "$api" -H "Authorization: Bearer $CNB_TOKEN" -H 'Accept: application/vnd.cnb.api+json' -H 'Content-Type: application/json' --data "$(jq -nc '{tag_name:"catalog-latest",target_commitish:"main",name:"Catalog latest pointer",draft:false,make_latest:"false"}')" | jq -er '.id')"; fi
          upload() {
            file="$1"
            form="$(jq -nc --arg name "$(basename "$file")" --argjson size "$(wc -c < "$file")" '{asset_name:$name,size:$size,ttl:0,overwrite:true}')"
            ticket="$(curl -fsS -X POST "$api/$release_id/asset-upload-url" -H "Authorization: Bearer $CNB_TOKEN" -H 'Accept: application/vnd.cnb.api+json' -H 'Content-Type: application/json' --data "$form")"
            curl -fsS -X PUT --upload-file "$file" "$(jq -er '.upload_url' <<<"$ticket")"
            curl -fsS -X POST -H "Authorization: Bearer $CNB_TOKEN" -H 'Accept: application/vnd.cnb.api+json' "$(jq -er '.verify_url' <<<"$ticket")?ttl=0"
          }
          upload latest.json
          upload latest.json.sig
          verify_cnb_asset() {
            file="$1"
            release_json="$2"
            name="$(basename "$file")"
            if ! asset="$(jq -e --arg name "$name" '.assets[]? | select(.name == $name)' <<<"$release_json")"; then
              echo "CNB asset not found after upload: $name" >&2
              return 1
            fi
            hash_algo="$(jq -er '.hash_algo // empty' <<<"$asset" | tr '[:upper:]' '[:lower:]')"
            expected_hash="$(jq -er '.hash_value' <<<"$asset" | tr '[:upper:]' '[:lower:]')"
            expected_size="$(jq -er '.size' <<<"$asset")"
            actual_hash="$(sha256sum "$file" | awk '{print $1}')"
            actual_size="$(wc -c < "$file" | tr -d '[:space:]')"
            case "$hash_algo" in
              sha256|sha-256|sha_256) ;;
              *)
              echo "unsupported CNB hash algorithm for $name: $hash_algo" >&2
              return 1
              ;;
            esac
            test "$actual_size" = "$expected_size" || {
              echo "CNB size mismatch for $name: expected $expected_size, got $actual_size" >&2
              return 1
            }
            test "$actual_hash" = "$expected_hash" || {
              echo "CNB SHA-256 mismatch for $name" >&2
              return 1
            }
          }
          release_after_upload="$(curl -fsS "$api/$release_id" -H "Authorization: Bearer $CNB_TOKEN" -H 'Accept: application/vnd.cnb.api+json')"
          verify_cnb_asset latest.json "$release_after_upload"
          verify_cnb_asset latest.json.sig "$release_after_upload"
          curl -fsS -X PATCH "$api/$release_id" \
            -H "Authorization: Bearer $CNB_TOKEN" \
            -H 'Accept: application/vnd.cnb.api+json' \
            -H 'Content-Type: application/json' \
            --data '{"draft":false,"make_latest":"false"}' >/dev/null
          latest_published="$(curl -fsS "$api/$release_id" -H "Authorization: Bearer $CNB_TOKEN" -H 'Accept: application/vnd.cnb.api+json')"
          test "$(jq -er '.draft' <<<"$latest_published")" = false
      - name: Publish immutable releases
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          CNB_TOKEN: ${{ secrets.CNB_CATALOG_TOKEN }}
          CNB_REPOSITORY: ${{ vars.CNB_CATALOG_REPOSITORY }}
        run: |
          api="https://api.cnb.cool/${CNB_REPOSITORY}/-/releases"
          release_id="$(cat cnb-immutable-release-id)"
          curl -fsS -X PATCH "$api/$release_id" \
            -H "Authorization: Bearer $CNB_TOKEN" \
            -H 'Accept: application/vnd.cnb.api+json' \
            -H 'Content-Type: application/json' \
            --data '{"draft":false,"make_latest":"false"}' >/dev/null
          published="$(curl -fsS "$api/$release_id" -H "Authorization: Bearer $CNB_TOKEN" -H 'Accept: application/vnd.cnb.api+json')"
          test "$(jq -er '.draft' <<<"$published")" = false
          gh release edit "$(jq -r '.release_tag' latest.json)" --draft=false
